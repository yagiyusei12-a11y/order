<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__PAGE_TITLE__</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
      background: linear-gradient(165deg, #f5f8fc 0%, #e8eef5 45%, #dce6f2 100%);
      color: #152232;
    }
    .card {
      width: 100%;
      max-width: 28rem;
      background: #fff;
      border: 1px solid #c5d0df;
      border-radius: 16px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 10px 40px rgba(21, 34, 50, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.2rem;
      font-weight: 800;
      color: #5d4037;
    }
    .msg {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.7;
      color: #b45309;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>__PAGE_TITLE__</h1>
    <p class="msg">__MAINTENANCE_MESSAGE__</p>
  </div>
</body>
</html>
